name: CI

on:
  push:
    branches: [main, 'renovate/**']
    # renovate/**, since 2026-09-16: Renovate merges a branch to main itself
    # once this run is green on it, and never a branch that has no run.
    # Tags are cut by release.yml now, and a tag it pushes does not start
    # this workflow. The trigger stays for a tag somebody pushes by hand,
    # which is the one case the check below still has to catch.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fail before the slow steps if the tag and package.json disagree: a
      # consumer reads the version from package.json once installed, so a
      # mismatch ships a package that lies about which release it is. Only
      # reachable by a hand-pushed tag since 2026-09-16; release.yml makes
      # the same check of the commit it tags.
      #
      # This package has a third copy of the number: VERSION in src/contract.ts,
      # hardcoded so a vendored browser bundle can say which release it is.
      # tools/check-exports.mjs holds that one against package.json, and it runs
      # below. semantic-release writes it through tools/set-version.mjs and
      # rebuilds dist/browser in the same release commit, so the three still
      # move together - release.config.mjs has the order.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(npm pkg get version | tr -d '"')"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json says $pkg"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches package.json"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Consumers install from git, so `prepare` runs this on their machine;
      # it runs here so a pull request cannot break it. Before the tests, because test/runtime.test.ts reads dist/runtime.js -
      # until 2026-09-16 the `prepare` script built it during `npm ci`, and
      # the day that script went, this order was what still had to.
      - run: npm run build

      # The licensing rule is asserted here. A failure is a licence problem,
      # not just a broken test.
      - run: npm test

      # An entry point nobody imports from outside the package is an entry point
      # nobody has checked. Every one of 2.0.0's was wrong.
      - run: npm run check:exports

      # The browser build is committed, because the consumers that need it have
      # no package manager to run `prepare` with. So it has to still match.
      - name: the committed browser build is current
        run: git diff --exit-code -- dist/browser
